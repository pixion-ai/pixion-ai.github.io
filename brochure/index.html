<!DOCTYPE html>
<html lang="ko">
<head>

<title>PIXION 제품소개서</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #08090a;
    --bg2: #111215;
    --border: rgba(255,255,255,0.08);
    --text: #f0f0ee;
    --muted: #888884;
    --accent: #c8f5c0;
    --accent2: #4fd9a0;
  }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    font-size: 16px;
    line-height: 1.7;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  main {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: 3.5rem 1.25rem 3rem;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .logo img { height: 26px; display: block; margin-bottom: 2.5rem; }
  .eyebrow {
    font-family: 'DM Mono', monospace; font-size: 12px;
    color: var(--accent2); letter-spacing: 0.12em;
    text-transform: uppercase; margin-bottom: 1rem;
  }
  h1 {
    font-size: clamp(1.9rem, 7vw, 2.6rem);
    font-weight: 300; line-height: 1.2;
    letter-spacing: -0.02em; margin-bottom: 1rem;
  }
  h1 em { font-style: normal; color: var(--accent); }
  .desc { color: var(--muted); font-size: 15px; margin-bottom: 2rem; }
  .actions { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 2rem; }
  .btn {
    display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
    padding: 1rem 1.25rem; border-radius: 10px;
    font-size: 16px; font-weight: 500; text-decoration: none;
    border: 0.5px solid var(--border); color: var(--text);
    background: var(--bg2); transition: border-color 0.2s, background 0.2s, opacity 0.2s;
  }
  .btn small { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: 0.04em; }
  .btn:hover { border-color: rgba(255,255,255,0.2); }
  .btn.primary { background: var(--accent); color: #08090a; border-color: transparent; }
  .btn.primary small { color: rgba(8,9,10,0.6); }
  .btn.primary:hover { opacity: 0.9; }
  .links { list-style: none; display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; font-size: 14px; margin-bottom: 2.5rem; }
  .links a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
  .links a:hover { color: var(--text); }
  .contact { font-size: 13px; color: var(--muted); border-top: 0.5px solid var(--border); padding-top: 1.25rem; }
  .contact a { color: var(--accent); text-decoration: none; }
  @media (min-width: 480px) {
    .actions { flex-direction: row; }
    .btn { flex: 1; flex-direction: column; align-items: flex-start; gap: 0.25rem; }
  }
</style>
</head>
<body>
<main>
  <a class="logo" href="../"><img src="../logo-white.png" alt="PIXION"></a>
  <p class="eyebrow">Product Brochure</p>
  <h1>AIoT 조명형 사이니지<br><em>제품소개서</em></h1>
  <p class="desc">기존 조명 인프라를 활용해 공사 없이 바닥과 벽을 광고·홍보 매체로 바꾸는 PIXION 조명형 사이니지 소개 자료입니다.</p>

  <div class="actions">
    <a class="btn primary" href="pixion-lighting-signage.html">웹에서 보기 <small>HTML</small></a>
    <a class="btn" href="pixion-lighting-signage.pdf" download="PIXION 조명형 사이니지 제품소개서.pdf">PDF 다운로드 <small>1 MB</small></a>
  </div>

  <ul class="links">
    <li><a href="pixion-lighting-signage.pdf" target="_blank" rel="noopener">PDF 브라우저에서 열기</a></li>
    <li><a href="https://youtu.be/kEMaPmPLJ3I" target="_blank" rel="noopener">시연 영상</a></li>
    <li><a href="../">홈페이지</a></li>
  </ul>

  <p class="contact">주식회사 픽시온 · <a href="mailto:representative@pixion.ai">representative@pixion.ai</a></p>
</main>
</body>
</html>
